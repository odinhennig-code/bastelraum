name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Bastelraum.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Bastelraum App ${{ github.run_number }}
          body: Neueste Version der Bastelraum-App. Bastelraum.apk herunterladen und auf dem Tablet öffnen.
          files: Bastelraum.apk
          make_latest: true
