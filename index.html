<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080C">
<title>Bastelraum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Grundlagen ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07080C;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:Outfit,system-ui,sans-serif;color:#fff}
button,input{font-family:inherit;color:#fff}
button{cursor:pointer}
#stage{position:fixed;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:#07080C}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:rgba(255,255,255,.7)}

/* ---------- Glas ---------- */
.glass{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 60px rgba(0,0,0,.35);transition:background .3s,transform .25s cubic-bezier(.2,.8,.2,1)}
.gb{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,background .2s}
.gb:active{transform:scale(.92);background:rgba(255,255,255,.2)}
.accent{border:0;background:linear-gradient(135deg,#FFC56B,#FF7A2F);color:#1A0E00!important;font-weight:600;box-shadow:0 10px 30px rgba(255,140,50,.4);transition:transform .15s}
.accent:active{transform:scale(.94)}
.pill{border-radius:999px}
.card{border-radius:30px;padding:22px}

/* ---------- Animationen ---------- */
.fade{animation:fadein .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.orb{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{50%{transform:translate(90px,60px) scale(1.15)}100%{transform:translate(-60px,40px) scale(.9)}}
.colon{animation:tick 1s steps(1) infinite}@keyframes tick{50%{opacity:.25}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 0 rgba(255,170,60,.35)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 18px rgba(255,170,60,0)}}
.glass.ring{animation:blink 1s infinite}
@keyframes blink{50%{background:rgba(255,150,40,.45);transform:scale(1.01)}}
.toast{animation:drop .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.9)}}
.nav{transition:background .3s,transform .2s}.nav:active{transform:scale(.88)}
.arc{transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 12px rgba(255,160,60,.6))}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.aur{position:absolute;border-radius:50%;animation:aur 22s ease-in-out infinite alternate}
@keyframes aur{50%{transform:translate(160px,-80px) rotate(25deg) scale(1.2)}100%{transform:translate(-120px,60px) rotate(-15deg) scale(.95)}}
.flt{animation:flt 4s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
.shift{animation:shift 90s ease-in-out infinite alternate}@keyframes shift{to{transform:translate(40px,-24px)}}
.secbar{transition:width 1s linear}
.eqbar{width:5px;height:100%;border-radius:3px;background:rgba(255,255,255,.85);transform-origin:bottom;transform:scaleY(.15)}
.playing .eqbar{animation:eq .9s ease-in-out infinite alternate}@keyframes eq{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
.playing .art{animation:art 3s ease-in-out infinite}@keyframes art{50%{transform:scale(1.03) rotate(-1deg)}}
.live{animation:tw 1.4s ease-in-out infinite}
.mic.on{background:rgba(255,80,80,.35);animation:micp 1.2s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 12px rgba(255,80,80,0),inset 0 1px 0 rgba(255,255,255,.3)}0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.5),inset 0 1px 0 rgba(255,255,255,.3)}}

/* ---------- Layout ---------- */
#wrap{position:relative;height:100%;padding:36px 48px 28px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-start}
.view{flex:1;min-height:0}
.grid3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:20px;height:100%}
.col{display:flex;flex-direction:column;gap:20px;min-height:0}
#dock{align-self:center;display:flex;gap:6px;padding:8px;border-radius:999px}
#dock button{width:56px;height:56px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
#dock button.on{background:rgba(255,255,255,.22)}
.label{font-size:15px;color:rgba(255,255,255,.7)}
input.field{flex:1;height:54px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:18px;padding:0 22px;outline:none;user-select:text}
input.field::placeholder{color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div id="stage">
  <div class="orb" style="width:620px;height:620px;left:-120px;top:-180px;background:#C8701A;filter:blur(140px);opacity:.55"></div>
  <div class="orb" style="animation-delay:-6s;width:560px;height:560px;right:-140px;top:120px;background:#2F4FD8;filter:blur(150px);opacity:.5"></div>
  <div class="orb" style="animation-delay:-12s;width:480px;height:480px;left:420px;bottom:-260px;background:#8A3FD1;filter:blur(150px);opacity:.4"></div>

  <div id="wrap">
    <header>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="num" style="font-size:84px;font-weight:500;letter-spacing:-2px;line-height:.9"><span id="clkH">00</span><span class="colon">:</span><span id="clkM">00</span></span>
        <span id="date" style="font-size:18px" class="muted"></span>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
      <div id="miniRadio" class="glass pill hidden fade" style="display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px">
        <button id="miniOpen" aria-label="Radio öffnen" style="display:flex;align-items:center;gap:10px;border:0;background:none;padding:0">
          <span id="miniArt" style="width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;overflow:hidden"></span>
          <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.15">
            <span style="font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.6)">LÄUFT</span>
            <span id="miniName" style="font-size:15px;font-weight:600"></span>
          </span>
          <span class="playing" style="display:flex;align-items:flex-end;gap:3px;height:16px;margin:0 4px"><span class="eqbar" style="width:3px;animation-duration:.7s"></span><span class="eqbar" style="width:3px;animation-duration:.9s;animation-delay:-.3s"></span><span class="eqbar" style="width:3px;animation-duration:.6s;animation-delay:-.5s"></span><span class="eqbar" style="width:3px;animation-duration:.8s;animation-delay:-.2s"></span></span>
        </button>
        <button id="miniStop" class="gb" aria-label="Radio pausieren" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
      </div>
      <div id="weatherPill" class="glass pill hidden" style="display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 11a4 4 0 0 1-2.5 8z"/></svg>
        <span id="weatherTxt"></span>
      </div>
      </div>
    </header>

    <!-- ================= START ================= -->
    <div id="vHome" class="view">
      <div class="grid3">
        <!-- Timer -->
        <section id="timerCard" class="glass fade" style="border-radius:34px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;justify-content:space-between">
          <div style="align-self:stretch;display:flex;justify-content:space-between;align-items:center;min-height:30px">
            <span class="label">Timer</span>
            <div id="otherTimers" style="display:flex;gap:6px"></div>
          </div>
          <div style="position:relative;width:210px;height:210px">
            <svg width="210" height="210" viewBox="0 0 256 256" style="overflow:visible">
              <defs><linearGradient id="arcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC56B"/><stop offset="1" stop-color="#FF7A2F"/></linearGradient></defs>
              <circle cx="128" cy="128" r="116" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="14"/>
              <circle id="arc" class="arc" cx="128" cy="128" r="116" fill="none" stroke="url(#arcg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="729" stroke-dashoffset="729" transform="rotate(-90 128 128)"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
              <span id="bigTime" class="num" style="font-size:32px;font-weight:500;line-height:1">00:00:00</span>
              <span id="subLabel" style="font-size:13px" class="muted">Zeit einstellen</span>
            </div>
          </div>
          <div id="tEdit" style="display:flex;flex-direction:column;align-items:center;gap:14px;align-self:stretch">
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-self:stretch">
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button class="gb" data-step="h:1" aria-label="Stunde mehr" style="width:100%;height:46px;border-radius:16px;font-size:28px">+</button><span style="font-size:12px;letter-spacing:.5px" class="muted">STD</span><button class="gb" data-step="h:-1" aria-label="Stunde weniger" style="width:100%;height:46px;border-radius:16px;font-size:28px">−</button></div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button class="gb" data-step="m:1" aria-label="Minute mehr" style="width:100%;height:46px;border-radius:16px;font-size:28px">+</button><span style="font-size:12px;letter-spacing:.5px" class="muted">MIN</span><button class="gb" data-step="m:-1" aria-label="Minute weniger" style="width:100%;height:46px;border-radius:16px;font-size:28px">−</button></div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button class="gb" data-step="s:1" aria-label="Sekunde mehr" style="width:100%;height:46px;border-radius:16px;font-size:28px">+</button><span style="font-size:12px;letter-spacing:.5px" class="muted">SEK</span><button class="gb" data-step="s:-1" aria-label="Sekunde weniger" style="width:100%;height:46px;border-radius:16px;font-size:28px">−</button></div>
            </div>
            <div style="display:flex;gap:10px;align-self:stretch">
              <button id="tReset" class="gb pill" style="flex:1;height:54px;font-size:16px">Zurücksetzen</button>
              <button id="tStart" class="accent pill" style="flex:1.4;height:54px;font-size:18px">Start</button>
            </div>
          </div>
          <div id="tRun" class="hidden" style="display:flex;align-items:center;gap:10px;align-self:stretch;height:194px">
            <button id="tStop" class="gb pill" style="flex:1;height:58px;font-size:16px">Stopp</button>
            <button id="tPause" class="accent pill" style="flex:1.3;height:58px;font-size:18px">Pause</button>
            <button id="tNew" class="gb" aria-label="Neuer Timer" style="width:58px;height:58px;border-radius:50%;font-size:28px">+</button>
          </div>
        </section>

        <!-- Mitte -->
        <div class="col">
          <section class="glass card fade" style="animation-delay:.15s;display:flex;flex-direction:column;gap:12px">
            <span class="label">Schnell schicken</span>
            <div id="quickMsgs" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"></div>
          </section>
          <section class="glass card fade" style="animation-delay:.25s;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0">
            <span class="label">Stoppuhr</span>
            <span id="swTime" class="num" style="font-size:52px;font-weight:500;letter-spacing:-1px;text-align:center">00:00</span>
            <div style="display:flex;gap:8px">
              <button id="swReset" class="gb pill" style="flex:1;height:50px;font-size:15px">Zurücksetzen</button>
              <button id="swToggle" class="accent pill" style="flex:1;height:50px;font-size:16px">Start</button>
            </div>
          </section>
        </div>

        <!-- Rechts -->
        <div class="col">
          <button id="callBtn" class="glass fade pulse" style="animation-delay:.2s;flex:1.2;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,170,60,.16)">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="callTitle" style="font-size:28px;font-weight:600">Odin rufen</span>
            <span id="callSub" style="font-size:13px" class="muted">Schickt Odin eine Nachricht aufs Handy</span>
          </button>
          <section id="msgCard" class="glass card fade" style="animation-delay:.3s;flex:1;display:flex;flex-direction:column;justify-content:space-between"></section>
        </div>
      </div>
    </div>

    <!-- ================= RADIO ================= -->
    <div id="vRadio" class="view hidden">
      <div style="display:grid;grid-template-columns:1.15fr 1fr;gap:20px;height:100%">
        <section id="player" class="glass fade" style="border-radius:36px;padding:28px 32px;display:flex;align-items:center;gap:32px;overflow:hidden;position:relative">
          <div id="glow" style="position:absolute;width:420px;height:420px;left:-120px;top:-80px;border-radius:50%;filter:blur(90px);opacity:.45;transition:background .6s"></div>
          <div id="art" class="art" style="position:relative;flex:none;width:210px;height:210px;border-radius:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:background .6s">
            <span id="artTxt" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;letter-spacing:-1px"></span>
            <span id="artFav" class="hidden" style="position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFD36B"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"/></svg></span>
          </div>
          <div style="position:relative;flex:1;display:flex;flex-direction:column;gap:16px;min-width:0">
            <div style="display:flex;align-items:center;gap:8px"><span id="liveDot" style="width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)"></span><span id="rState" style="font-size:13px;letter-spacing:2px" class="muted">PAUSIERT</span></div>
            <span id="rName" style="font-size:38px;font-weight:600;line-height:1.05"></span>
            <div id="eq" style="display:flex;align-items:flex-end;gap:5px;height:34px"></div>
            <div style="display:flex;align-items:center;gap:14px">
              <button id="rPrev" class="gb" aria-label="Vorheriger Sender" style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
              <button id="rPlay" aria-label="Abspielen oder Pausieren" style="width:82px;height:82px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.35)"></button>
              <button id="rNext" class="gb" aria-label="Nächster Sender" style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
              <input id="vol" type="range" min="0" max="100" aria-label="Lautstärke" style="flex:1;accent-color:#fff">
            </div>
          </div>
        </section>
        <section class="glass fade" style="animation-delay:.1s;border-radius:36px;padding:24px;display:flex;flex-direction:column;gap:12px">
          <span class="label" style="padding:0 4px">Sender</span>
          <div id="stationGrid" style="flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px"></div>
        </section>
      </div>
    </div>

    <!-- ================= MATERIAL ================= -->
    <div id="vMat" class="view hidden">
      <section class="glass fade" style="height:100%;border-radius:34px;padding:26px 30px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:22px;font-weight:600">Material</span>
          <span id="matInfo" class="muted" style="font-size:15px"></span>
        </div>
        <div id="matList" style="flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:10px"></div>
        <div style="display:flex;gap:10px">
          <input id="matInput" class="field" placeholder="Neues Material, z. B. Holzleim" autocomplete="off">
          <button class="gb mic" data-mic="matInput" aria-label="Spracheingabe" style="width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button id="matAdd" class="accent pill" style="padding:0 26px;height:54px;font-size:16px">Hinzufügen</button>
        </div>
      </section>
    </div>

    <nav id="dock" class="glass">
      <button data-view="home" class="nav on" aria-label="Start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button data-view="mat" class="nav" aria-label="Material"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg></button>
      <button data-view="radio" class="nav" aria-label="Radio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button data-view="night" class="nav" aria-label="Nachtmodus"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </nav>
  </div>

  <div id="toast" class="glass hidden" style="position:absolute;top:28px;left:50%;margin-left:-200px;width:400px;text-align:center;padding:14px 20px;border-radius:999px;font-size:16px;background:rgba(30,30,40,.55)"></div>

  <!-- ================= NACHT 1 ================= -->
  <div id="night1" class="hidden" style="position:absolute;inset:0;background:#000">
    <button id="wake1" aria-label="Aufwecken" style="position:absolute;inset:0;border:0;background:transparent;color:rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
      <span id="n1Clock" class="num" style="font-size:160px;font-weight:400;letter-spacing:-4px;line-height:1"></span>
      <span style="font-size:16px">Tippen zum Aufwecken</span>
    </button>
    <button id="toNight2" class="nav" aria-label="Schöner Nachtmodus" style="position:absolute;bottom:32px;left:50%;margin-left:-26px;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
    </button>
  </div>

  <!-- ================= NACHT 2 ================= -->
  <div id="night2" class="hidden" style="position:absolute;inset:0;background:#02030A;overflow:hidden">
    <div class="aur" style="width:900px;height:420px;left:-200px;top:-140px;background:#1C3BAA;filter:blur(120px);opacity:.55"></div>

const p2 = (n) => String(n).padStart(2, '0');
const fmt = (s) => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? h + ':' + p2(m) + ':' + p2(x) : p2(m) + ':' + p2(x); };
const hhmm = (d) => p2(d.getHours()) + ':' + p2(d.getMinutes());
const store = {

const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Auf jede Tablet-Größe skalieren */
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 800);

  st.style.transform = 'scale(' + s + ')';

}

let ac = null;
function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} return ac; }
function tone(notes, type, vol) {
  const c = audio(); if (!c) return;
  notes.forEach(([f, t, d]) => {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + 0.05);
  });
}
const sndAlarm = () => tone([[659.25, 0, 1.1], [880, 0.28, 1.1], [1318.5, 0.56, 1.1]], 'sine', 0.22);
const sndSend = () => tone([[740, 0, 0.12], [1109, 0.07, 0.22]], 'sine', 0.18);
const sndCall = () => tone([[523, 0, 0.25], [784, 0.1, 0.3], [1047, 0.2, 0.45]], 'triangle', 0.2);
const sndMsg = () => tone([[1175, 0, 0.5], [880, 0.18, 0.7]], 'sine', 0.2);

/* Bildschirm anlassen + Vollbild beim ersten Tippen */
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('pointerdown', function first() {
  audio(); keepAwake();
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (e) {}
  document.removeEventListener('pointerdown', first);
});

}

/* =========================================================
   TIMER
   ========================================================= */
let set = { h: 0, m: 0, s: 0 }, editing = true, timers = [], nid = 1;
const left = (t) => t.pausedLeft != null ? t.pausedLeft : Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000));
document.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => {
  const [k, d] = b.dataset.step.split(':'); const max = k === 'h' ? 23 : 59;
  let v = set[k] + (+d); set[k] = v > max ? 0 : v < 0 ? max : v; renderTimer();
});
$('tReset').onclick = () => { set = { h: 0, m: 0, s: 0 }; renderTimer(); };
$('tStart').onclick = () => {
  const sec = set.h * 3600 + set.m * 60 + set.s;
  if (!sec) { say('Bitte erst eine Zeit einstellen'); return; }
  audio();
  timers.unshift({ id: nid++, total: sec, endAt: Date.now() + sec * 1000, pausedLeft: null });
  timers = timers.slice(0, 5); set = { h: 0, m: 0, s: 0 }; editing = false; renderTimer();
};
$('tPause').onclick = () => {
  const t = timers[0]; if (!t) return;
  if (t.pausedLeft != null) { t.endAt = Date.now() + t.pausedLeft * 1000; t.pausedLeft = null; } else { t.pausedLeft = left(t); }
  renderTimer();
};
$('tStop').onclick = () => { timers.shift(); if (!timers.length) editing = true; renderTimer(); };
$('tNew').onclick = () => { editing = true; renderTimer(); };

function renderTimer() {
  const main = timers[0], isEdit = editing || !main;
  const ringing = !isEdit && left(main) <= 0;
  $('tEdit').classList.toggle('hidden', !isEdit);
  $('tRun').classList.toggle('hidden', isEdit);
  $('timerCard').classList.toggle('ring', ringing);
  if (isEdit) {
    const sec = set.h * 3600 + set.m * 60 + set.s;
    $('bigTime').textContent = p2(set.h) + ':' + p2(set.m) + ':' + p2(set.s);
    $('subLabel').textContent = sec ? 'Ende um ' + hhmm(new Date(Date.now() + sec * 1000)) : 'Zeit einstellen';
    $('arc').style.strokeDashoffset = sec ? 0 : 729;
  } else {
    const l = left(main);
    $('bigTime').textContent = fmt(l);
    $('subLabel').textContent = ringing ? 'Timer fertig!' : main.pausedLeft != null ? 'Pausiert' : 'Ende um ' + hhmm(new Date(main.endAt));
    $('arc').style.strokeDashoffset = 729 * (1 - l / main.total);
    $('tPause').textContent = main.pausedLeft != null ? 'Weiter' : 'Pause';
    $('tStop').textContent = ringing ? 'Aus' : 'Stopp';
  }
  const others = (isEdit ? timers : timers.slice(1)).slice(0, 3);
  const box = $('otherTimers'); box.innerHTML = '';
  others.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'gb pill num fade'; b.style.cssText = 'padding:6px 12px;font-size:13px';
    b.textContent = left(t) <= 0 ? 'Fertig!' : fmt(left(t));
    b.onclick = () => { timers = [t, ...timers.filter((x) => x !== t)]; editing = false; renderTimer(); };
    box.appendChild(b);
  });
}

/* =========================================================

const player = new Audio(); player.preload = 'none';

function playStation(i) {
  station = i; store.set('station', i); urlIdx = 0;
  const st = STATIONS[i];
  if (!st.urls.length) { stopRadio(); say('Für ' + st.name + ' fehlt noch die Stream-Adresse'); renderRadio(); return; }
  playing = true; setRState('VERBINDET …'); tryUrl(); renderRadio();
}
function tryUrl() {
  const st = STATIONS[station];
  player.src = st.urls[urlIdx];
  player.play().catch(() => {});
}
player.addEventListener('playing', () => { setRState('LIVE'); renderRadio(); });
player.addEventListener('waiting', () => { if (playing) setRState('LÄDT …'); });
player.addEventListener('error', () => {
  if (!playing) return;
  const st = STATIONS[station];
  if (urlIdx < st.urls.length - 1) { urlIdx++; tryUrl(); }
  else { stopRadio(); say(st.name + ' ist gerade nicht erreichbar'); }
});
function stopRadio() { playing = false; player.pause(); player.removeAttribute('src'); player.load(); setRState('PAUSIERT'); renderRadio(); }
function setRState(t) { $('rState').textContent = t; }

$('rPlay').onclick = () => playing ? stopRadio() : playStation(station);

$('rNext').onclick = () => { const i = (station + 1) % STATIONS.length; playing ? playStation(i) : (station = i, renderRadio()); };

function tile(st, size, font) {
  return st.logo
    ? '<img src="' + esc(st.logo) + '" alt="" style="width:100%;height:100%;object-fit:contain;background:#fff;padding:' + Math.round(size * 0.1) + 'px">'
    : '<span style="font-size:' + font + 'px;font-weight:700">' + esc(st.short) + '</span>';
}
function renderRadio() {
  const st = STATIONS[station];
  $('player').classList.toggle('playing', playing);

    const sub = active && playing ? 'Läuft gerade' : x.fav ? '★ Lieblingssender' : 'Antippen zum Hören';
    b.innerHTML = '<span style="flex:none;width:50px;height:50px;border-radius:15px;overflow:hidden;background:' + x.grad + ';display:flex;align-items:center;justify-content:center">' + tile(x, 50, 15) + '</span>'
      + '<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:17px;font-weight:600">' + esc(x.name) + '</span><span style="font-size:12px;color:rgba(255,255,255,.6)">' + sub + '</span></span>';
    b.onclick = () => playStation(i);

    const status = m.qty === 0 ? 'Leer' : m.qty === 1 ? 'Fast leer' : '';
    row.innerHTML = '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:18px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</span>'
      + (status ? '<span style="font-size:12px;color:#FF9A80">' + status + '</span>' : '') + '</div>'
      + '<button class="gb" data-a="minus" aria-label="Weniger" style="width:44px;height:44px;border-radius:50%;font-size:22px">−</button>'
      + '<span class="num" style="min-width:34px;text-align:center;font-size:22px;font-weight:600">' + m.qty + '</span>'
      + '<button class="gb" data-a="plus" aria-label="Mehr" style="width:44px;height:44px;border-radius:50%;font-size:22px">+</button>'
      + '<button data-a="del" aria-label="Löschen" style="width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    row.querySelector('[data-a=minus]').onclick = () => { m.qty = Math.max(0, m.qty - 1); saveMats(); };
    row.querySelector('[data-a=plus]').onclick = () => { m.qty++; saveMats(); };
    row.querySelector('[data-a=del]').onclick = () => { mats = mats.filter((x) => x !== m); sndTap(); saveMats(); };
    l.appendChild(row);
  });
}

/* =========================================================
   SPRACHEINGABE (für jedes Textfeld mit Mikrofon-Knopf)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
document.querySelectorAll('[data-mic]').forEach((btn) => {
  btn.onclick = () => {
    if (!SR) { say('Spracheingabe geht in diesem Browser nicht – bitte Chrome nutzen'); return; }
    if (btn.rec) { btn.rec.stop(); return; }
    const input = $(btn.dataset.mic);
    const rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = true; rec.maxAlternatives = 1;
    btn.rec = rec; btn.classList.add('on'); sndTap();
    rec.onresult = (e) => { let t = ''; for (const r of e.results) t += r[0].transcript; input.value = t.charAt(0).toUpperCase() + t.slice(1); };
    rec.onerror = (e) => { if (e.error === 'not-allowed') say('Bitte das Mikrofon erlauben'); };
    rec.onend = () => { btn.rec = null; btn.classList.remove('on'); };
    rec.start();
  };
});

/* =========================================================
   WETTER (Standort vom Tablet, Daten von Open-Meteo)
   ========================================================= */
const WMO = (c) => c === 0 ? 'Klar' : c <= 2 ? 'Leicht bewölkt' : c === 3 ? 'Bewölkt' : c <= 48 ? 'Nebel' : c <= 57 ? 'Nieselregen' : c <= 67 ? 'Regen' : c <= 77 ? 'Schnee' : c <= 82 ? 'Schauer' : c <= 86 ? 'Schneeschauer' : 'Gewitter';
let weather = null;
function loadWeather() {
  const go = (lat, lon) => fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code&hourly=temperature_2m&forecast_days=2&timezone=auto')
    .then((r) => r.json()).then((d) => {
      const nowIdx = d.hourly.time.findIndex((t) => new Date(t) > new Date());
      weather = {
        temp: Math.round(d.current.temperature_2m), desc: WMO(d.current.weather_code),
        hourly: [0, 1, 2, 3].map((i) => ({ t: d.hourly.time[nowIdx + i].slice(11, 13) + ' Uhr', v: Math.round(d.hourly.temperature_2m[nowIdx + i]) + '°' }))
      };
      store.set('weatherPos', [lat, lon]); renderWeather();
    }).catch(() => {});
  const saved = store.get('weatherPos', null);
  if (saved) go(saved[0], saved[1]);
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition((p) => go(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3)), () => {}, { timeout: 15000 });
}
function renderWeather() {
  if (!weather) return;
  $('weatherPill').classList.remove('hidden');
  $('weatherTxt').textContent = weather.temp + '° ' + weather.desc.toLowerCase();
  $('n2Weather').classList.remove('hidden');
  $('n2Temp').textContent = weather.temp + '°'; $('n2Desc').textContent = weather.desc;
  $('n2Hourly').innerHTML = weather.hourly.map((h) => '<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font-size:13px;color:rgba(255,255,255,.55)">' + h.t + '</span><span class="num" style="font-size:20px;font-weight:500">' + h.v + '</span></div>').join('');
}
loadWeather(); setInterval(loadWeather, 20 * 60 * 1000);

/* =========================================================
   STERNE FÜR DEN NACHTMODUS
   ========================================================= */
(function () {
  let h = '';
  for (let i = 0; i < 40; i++) {
    const r = (n) => ((Math.sin(i * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1;
    h += '<span class="tw" style="position:absolute;left:' + (r(1) * 100).toFixed(1) + '%;top:' + (r(2) * 70).toFixed(1) + '%;width:' + (1 + r(3) * 2).toFixed(1) + 'px;height:' + (1 + r(3) * 2).toFixed(1) + 'px;border-radius:50%;background:#fff;opacity:.8;animation-delay:' + (-r(4) * 3).toFixed(2) + 's"></span>';
  }
  $('stars').innerHTML = h;
})();

/* =========================================================
   TAKT (jede halbe Sekunde)
   ========================================================= */
let beat = 0;
function tick() {
  const d = new Date();
  $('clkH').textContent = p2(d.getHours()); $('clkM').textContent = p2(d.getMinutes());
  $('date').textContent = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  if (view === 'night') $('n1Clock').textContent = hhmm(d);
  if (view === 'night2') {
    $('n2H').textContent = p2(d.getHours()); $('n2M').textContent = p2(d.getMinutes()); $('n2S').textContent = p2(d.getSeconds());
    $('n2Date').textContent = $('date').textContent; $('secBar').style.width = (d.getSeconds() / 59 * 100) + '%';
  }
  renderTimer(); renderSw();
}
setInterval(() => {
  tick();
  beat++;
  const anyDone = timers.some((t) => left(t) <= 0);
  if (anyDone && beat % 4 === 0) { sndAlarm(); if (view.startsWith('night')) show('home'); }
}, 500);

/* Start */
renderMsg(); renderRadio(); renderMats(); show('home');
</script>
