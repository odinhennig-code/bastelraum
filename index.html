<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080C">
<title>Bastelraum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Grundlagen ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07080C;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:Outfit,system-ui,sans-serif;color:#fff}
button,input{font-family:inherit;color:#fff}
button{cursor:pointer}
#lOff{position:absolute;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,0);transition:background .35s,opacity .4s;pointer-events:auto}
#lOff.on{background:rgba(5,6,10,.88)}
#lOff.out{opacity:0}
#lOff .ln{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:linear-gradient(90deg,#ff2a3a00,#ff2a3a 18%,#ff5a66 50%,#ff2a3a 82%,#ff2a3a00);box-shadow:0 0 24px #ff2a3a,0 0 6px #ff5a66;transform:scaleX(0);transform-origin:0 50%}
#lOff.on .ln{animation:lOffLn .9s cubic-bezier(.7,0,.3,1) forwards}
@keyframes lOffLn{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1);transform-origin:0 50%;opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(0);transform-origin:100% 50%;opacity:0}}
#lOff .rg{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:4px solid #ff2a3a;box-shadow:0 0 40px rgba(255,42,58,.55),inset 0 0 40px rgba(255,42,58,.35);transform:scale(0);opacity:0}
#lOff.on .rg{animation:lOffRg .7s .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes lOffRg{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
#lOff .rg::after{content:'';position:absolute;left:50%;top:50%;width:150%;height:4px;margin:-2px 0 0 -75%;background:#ff2a3a;transform:rotate(-45deg) scaleX(0);box-shadow:0 0 16px #ff2a3a}
#lOff.on .rg::after{animation:lOffX .35s 1.15s ease-out forwards}
@keyframes lOffX{to{transform:rotate(-45deg) scaleX(.66)}}
#lOff .tx{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:330px;text-align:center}
#lOff .t1{font-size:56px;font-weight:700;letter-spacing:1px;opacity:0;transform:translateY(14px)}
#lOff .t2{font-size:24px;color:rgba(255,255,255,.75);opacity:0;transform:translateY(14px)}
#lOff.on .t1{animation:lOffT .5s 1.3s ease-out forwards}
#lOff.on .t2{animation:lOffT .5s 1.55s ease-out forwards}
@keyframes lOffT{to{opacity:1;transform:none}}
#lOff .sp{position:absolute;left:50%;top:50%;width:150px;height:140px;margin:-95px 0 0 -75px;opacity:0;filter:grayscale(1) brightness(.8)}
#lOff.on .sp{animation:lOffT .5s 1s ease-out forwards}
#stage{position:fixed;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:#07080C}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:rgba(255,255,255,.7)}

/* ---------- Glas ---------- */
.glass{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 60px rgba(0,0,0,.35);transition:background .3s,transform .25s cubic-bezier(.2,.8,.2,1)}
.gb{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,background .2s}
.gb:active{transform:scale(.92);background:rgba(255,255,255,.2)}
.accent{border:0;background:linear-gradient(135deg,#FFC56B,#FF7A2F);color:#1A0E00!important;font-weight:600;box-shadow:0 10px 30px rgba(255,140,50,.4);transition:transform .15s}
.accent:active{transform:scale(.94)}
.pill{border-radius:999px}
.card{border-radius:30px;padding:22px}

/* ---------- Animationen ---------- */
.fade{animation:fadein .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.orb{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{50%{transform:translate(90px,60px) scale(1.15)}100%{transform:translate(-60px,40px) scale(.9)}}
.colon{animation:tick 1s steps(1) infinite}@keyframes tick{50%{opacity:.25}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 0 rgba(255,170,60,.35)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 18px rgba(255,170,60,0)}}
.glass.ring{animation:blink 1s infinite}
@keyframes blink{50%{background:rgba(255,150,40,.45);transform:scale(1.01)}}
.toast{animation:drop .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.9)}}
.nav{transition:background .3s,transform .2s}.nav:active{transform:scale(.88)}
.arc{transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 12px rgba(255,160,60,.6))}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.aur{position:absolute;border-radius:50%;animation:aur 22s ease-in-out infinite alternate}
@keyframes aur{50%{transform:translate(160px,-80px) rotate(25deg) scale(1.2)}100%{transform:translate(-120px,60px) rotate(-15deg) scale(.95)}}
.flt{animation:flt 4s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
.shift{animation:shift 90s ease-in-out infinite alternate}@keyframes shift{to{transform:translate(40px,-24px)}}
.secbar{transition:width 1s linear}
html.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(24,26,36,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
html.lite .gb{box-shadow:none}
html.lite .orb,html.lite .aur,html.lite .pulse,html.lite .shift,html.lite .playing .art{animation:none}
html.lite .arc{filter:none}
html.lite #updateOv{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(4,5,10,.95)}
html.lite .fade{animation-duration:.3s}
.orb,.aur{will-change:transform}
#dock button.arm{background:rgba(255,190,110,.35);animation:pulse 1s ease-in-out infinite}
.setTile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);text-align:left;font-size:17px;font-weight:500}
.setTile:active{transform:scale(.96)}
/* Luigi */
#luigi{position:absolute;left:0;top:0;width:40px;height:140px;border:0;padding:0;background:transparent;z-index:41;display:flex;align-items:center;justify-content:flex-start;
  transform:translate(0px,330px);transition:opacity .3s}
.lhandle{position:relative;display:block;width:5px;height:64px;border-radius:0 5px 5px 0;background:linear-gradient(180deg,#FFB547,#FF5FA2,#8B6CFF,#4FA3FF,#FFB547);background-size:100% 300%;
  box-shadow:0 0 14px rgba(160,120,255,.65);animation:lflow 6s linear infinite,lbreath 5s ease-in-out infinite;
  transition:width .45s cubic-bezier(.3,1.4,.5,1),height .45s cubic-bezier(.3,1.4,.5,1),border-radius .45s,margin .45s}
@keyframes lflow{to{background-position:0 300%}}
@keyframes lbreath{0%,70%,100%{height:64px}80%{height:84px}90%{height:58px}}
#luigi:active .lhandle{filter:brightness(1.3)}
#luigi.away{opacity:0;pointer-events:none}
/* Luigi lebt: Formen */
.lfx{display:flex;align-items:center;justify-content:flex-start;transform-origin:50% 80%}
.lp{position:absolute;z-index:43;pointer-events:none;font-weight:700;font-size:15px;animation:lpuff 1.7s ease-out forwards;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes lpuff{0%{opacity:0;transform:translate(0,4px) scale(.6)}15%{opacity:1;transform:translate(0,-4px) scale(1)}100%{opacity:0;transform:translate(var(--dx,6px),-34px) scale(1.1)}}
#luigi.sleep .leye{transform:scaleY(.12)!important;animation:none}
#luigi.run .lleg.a,#luigi.run .lleg.b,#luigi.run .larm.a,#luigi.run .larm.b{animation-duration:.18s!important}
.lfly{position:absolute;z-index:40;width:6px;height:6px;border-radius:50%;background:#FFE08A;box-shadow:0 0 10px 3px rgba(255,220,120,.7);pointer-events:none}
.leyes{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:none;gap:4px}
.leyes i{display:block;width:3px;height:4px;border-radius:2px;background:#fff;animation:lblink 4.5s infinite}
@keyframes lblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#luigi[data-shape=orb],#luigi[data-shape=walker],#luigi[data-shape=line]{width:auto;height:auto}
#luigi[data-shape=orb] .lhandle{width:18px;height:18px;border-radius:50%;animation:lflow 4s linear infinite,lbob 2.4s ease-in-out infinite;background-size:300% 300%}
#luigi[data-shape=orb] .leyes{display:flex}
@keyframes lbob{50%{transform:translateY(-6px)}}
#luigi[data-shape=line] .lhandle{width:var(--w,40px);height:4px;border-radius:4px;animation:lflow 3s linear infinite;background:linear-gradient(90deg,#FFB547,#FF5FA2,#8B6CFF,#4FA3FF,#FFB547);background-size:300% 100%}
#luigi[data-shape=walker] .lhandle{display:none}
.lman{display:none;overflow:visible}
#luigi[data-shape=walker] .lman{display:block}
#luigi.flip .lman{transform:scaleX(-1)}
#luigi[data-shape=walker]{width:36px;height:48px}
.lsprite{position:absolute;left:-57px;top:-87px;width:150px;height:140px;pointer-events:none}
.lman .lleg,.lman .larm{transform-box:fill-box;transform-origin:50% 8%}
.lman .lbody{transform-box:fill-box;transform-origin:50% 100%;animation:lbreathe 3s ease-in-out infinite}
@keyframes lbreathe{50%{transform:scale(1.03,.97)}}
.lman .leye{transform-box:fill-box;transform-origin:center;animation:lblink 4.5s infinite}
#luigi.walking .lleg.a{animation:lleg .34s ease-in-out infinite alternate}
#luigi.walking .lleg.b{animation:lleg .34s ease-in-out infinite alternate-reverse}
#luigi.walking .larm.a{animation:lleg .34s ease-in-out infinite alternate-reverse}
#luigi.walking .larm.b{animation:lleg .34s ease-in-out infinite alternate}
@keyframes lleg{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes lstep{to{translate:0 -2px}}
#luigi.sit .lleg{transform:rotate(-75deg)}
#luigi.wave .larm.b{animation:lwave .5s ease-in-out infinite alternate}
@keyframes lwave{from{transform:rotate(-150deg)}to{transform:rotate(-110deg)}}
#lGlow{position:absolute;left:0;top:0;bottom:0;width:220px;z-index:37;pointer-events:none;opacity:0;transform:scaleX(.15);transform-origin:left;
  transition:opacity .45s,transform .7s cubic-bezier(.2,1,.3,1);
  background:linear-gradient(90deg,rgba(255,160,80,.55),rgba(190,110,255,.28) 30%,rgba(80,140,255,.08) 65%,transparent);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
#lGlow.on{opacity:calc(.55 + var(--lv,0) * .45);transform:scaleX(calc(.75 + var(--lv,0) * .9));animation:none;transition:opacity .12s,transform .12s;background-position:0 calc(var(--lv,0) * 100%)}
#lGlow{background-size:100% 200%}
@keyframes lglow{to{opacity:.65}}
#lShade{position:absolute;inset:0;z-index:36;background:rgba(2,3,10,.45);animation:fadein .4s both}
#lPanel{position:absolute;left:30px;bottom:122px;width:580px;z-index:42;border-radius:30px;padding:22px 28px 24px;display:flex;flex-direction:column;gap:12px;
  background:rgba(22,20,36,.86)!important;transform:translateX(-660px) scale(.96);opacity:0;pointer-events:none;
  transition:transform .65s cubic-bezier(.2,1.15,.3,1),opacity .35s}
#lPanel.open{transform:none;opacity:1;pointer-events:auto}
.lhead{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.5px;color:rgba(255,255,255,.6)}
.ldots{display:flex;gap:5px;align-items:center;height:26px;--lv:0}
.ldots i{display:block;width:8px;height:8px;border-radius:4px;transition:height .1s}
.ldots i:nth-child(1){background:#FFB547}.ldots i:nth-child(2){background:#FF5FA2}.ldots i:nth-child(3){background:#8B6CFF}.ldots i:nth-child(4){background:#4FA3FF}
#lPanel.listen .ldots i{animation:ldot .9s ease-in-out infinite}
#lPanel.listen .ldots i:nth-child(2){animation-delay:.12s}#lPanel.listen .ldots i:nth-child(3){animation-delay:.24s}#lPanel.listen .ldots i:nth-child(4){animation-delay:.36s}
@keyframes ldot{50%{height:calc(12px + var(--lv) * 14px)}}
#lPanel.think .ldots i{animation:lthink .6s ease-in-out infinite}
#lPanel.think .ldots i:nth-child(2){animation-delay:.1s}#lPanel.think .ldots i:nth-child(3){animation-delay:.2s}#lPanel.think .ldots i:nth-child(4){animation-delay:.3s}
@keyframes lthink{50%{transform:translateY(-7px)}}
#lHeard{font-size:26px;font-weight:500;line-height:1.25;color:#fff;min-height:33px}
#lSay{font-size:20px;line-height:1.4;color:#FFD9A8;animation:lpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lpop{from{opacity:0;transform:translateY(12px)}}
html.lite #lGlow.on{animation:none}
.upspin{animation:upspin 1s linear infinite}@keyframes upspin{to{transform:rotate(360deg)}}
.eqbar{width:5px;height:100%;border-radius:3px;background:rgba(255,255,255,.85);transform-origin:bottom;transform:scaleY(.15)}
.playing .eqbar{animation:eq .9s ease-in-out infinite alternate}@keyframes eq{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
.playing .art{animation:art 3s ease-in-out infinite}@keyframes art{50%{transform:scale(1.03) rotate(-1deg)}}
.live{animation:tw 1.4s ease-in-out infinite}
.mic.on{background:rgba(255,80,80,.35);animation:micp 1.2s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 12px rgba(255,80,80,0),inset 0 1px 0 rgba(255,255,255,.3)}0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.5),inset 0 1px 0 rgba(255,255,255,.3)}}

/* ---------- Layout ---------- */
#wrap{position:relative;height:100%;padding:36px 48px 28px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-start}
.view{flex:1;min-height:0}
.grid3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:20px;height:100%}
.col{display:flex;flex-direction:column;gap:20px;min-height:0}
#dock{align-self:center;display:flex;gap:6px;padding:8px;border-radius:999px}
#dock button{width:56px;height:56px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
#dock button.on{background:rgba(255,255,255,.22)}
.label{font-size:15px;color:rgba(255,255,255,.7)}
input.field{flex:1;height:54px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:18px;padding:0 22px;outline:none;user-select:text}
.seg{border:0;background:transparent;padding:10px 22px;border-radius:999px;font-size:16px;font-weight:500;color:rgba(255,255,255,.7);transition:background .25s,color .25s}
.seg.on{background:rgba(255,255,255,.2);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:13px}
.chip button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:12px;line-height:1}
.pchip{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:15px}
.pchip.on{background:linear-gradient(135deg,#FFC56B,#FF7A2F);color:#1A0E00;border-color:transparent;font-weight:600}
input[type=number]::-webkit-inner-spin-button{display:none}
input.field::placeholder{color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div id="stage">
  <div class="orb" style="width:900px;height:900px;left:-120px;top:-180px;background:radial-gradient(closest-side,#C8701A 0%,#C8701A99 35%,#C8701A00 100%);opacity:.55"></div>
  <div class="orb" style="animation-delay:-6s;width:860px;height:860px;right:-140px;top:120px;background:radial-gradient(closest-side,#2F4FD8 0%,#2F4FD899 35%,#2F4FD800 100%);opacity:.5"></div>
  <div class="orb" style="animation-delay:-12s;width:780px;height:780px;left:420px;bottom:-260px;background:radial-gradient(closest-side,#8A3FD1 0%,#8A3FD199 35%,#8A3FD100 100%);opacity:.4"></div>

  <div id="wrap">
    <header>
      <div style="display:flex;align-items:center;gap:26px">
        <span class="num" style="font-size:84px;font-weight:500;letter-spacing:-2px;line-height:.9"><span id="clkH">00</span><span class="colon">:</span><span id="clkM">00</span></span>
        <span style="width:1px;height:64px;background:rgba(255,255,255,.18)"></span>
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:34px;font-weight:600;line-height:1.05">Hallo Mama</span>
          <span id="date" style="font-size:18px" class="muted"></span>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
      <div id="miniRadio" class="glass pill hidden fade" style="display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px">
        <button id="miniOpen" aria-label="Radio öffnen" style="display:flex;align-items:center;gap:10px;border:0;background:none;padding:0">
          <span id="miniArt" style="width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;overflow:hidden"></span>
          <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.15">
            <span style="font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.6)">LÄUFT</span>
            <span id="miniName" style="font-size:15px;font-weight:600"></span>
          </span>
          <span class="playing" style="display:flex;align-items:flex-end;gap:3px;height:16px;margin:0 4px"><span class="eqbar" style="width:3px;animation-duration:.7s"></span><span class="eqbar" style="width:3px;animation-duration:.9s;animation-delay:-.3s"></span><span class="eqbar" style="width:3px;animation-duration:.6s;animation-delay:-.5s"></span><span class="eqbar" style="width:3px;animation-duration:.8s;animation-delay:-.2s"></span></span>
        </button>
        <button id="miniStop" class="gb" aria-label="Radio pausieren" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
      </div>
      <div id="weatherPill" class="glass pill hidden" style="display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 11a4 4 0 0 1-2.5 8z"/></svg>
        <span id="weatherTxt"></span>
      </div>
      </div>
    </header>

    <!-- ================= START ================= -->
    <div id="vHome" class="view">
      <div class="grid3">
        <!-- Timer -->
        <section id="timerCard" class="glass fade" style="border-radius:34px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;justify-content:space-between">
          <div style="align-self:stretch;display:flex;justify-content:space-between;align-items:center;min-height:30px">
            <span class="label">Timer</span>
            <div id="otherTimers" style="display:flex;gap:6px"></div>
          </div>
          <div style="position:relative;width:210px;height:210px">
            <svg width="210" height="210" viewBox="0 0 256 256" style="overflow:visible">
              <defs><linearGradient id="arcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC56B"/><stop offset="1" stop-color="#FF7A2F"/></linearGradient></defs>
              <circle cx="128" cy="128" r="116" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="14"/>
              <circle id="arc" class="arc" cx="128" cy="128" r="116" fill="none" stroke="url(#arcg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="729" stroke-dashoffset="729" transform="rotate(-90 128 128)"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
              <span id="bigTime" class="num" style="font-size:32px;font-weight:500;line-height:1">00:00:00</span>
              <span id="subLabel" style="font-size:13px" class="muted">Zeit einstellen</span>
            </div>
          </div>
          <div id="tEdit" style="display:flex;flex-direction:column;align-items:center;gap:14px;align-self:stretch">
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-self:stretch">

  notes.forEach(([f, t, d]) => {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;

  });
}

   Jedes Tablet hat einen eigenen, geheimen Code – nur wer den Code hat, kann mitlesen. */
const NTFY = 'https://ntfy.sh/';
function pairKey() {
  let k = store.get('pairKey', null);
  if (!k) {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; k = '';
    const r = new Uint32Array(10); (window.crypto || window.msCrypto).getRandomValues(r);
    for (let i = 0; i < 10; i++) k += A[r[i] % A.length];
    store.set('pairKey', k);
  }
  return k;
}
const topicOdin = () => 'bastelraum-' + pairKey().toLowerCase() + '-odin';
const topicTablet = () => 'bastelraum-' + pairKey().toLowerCase() + '-tablet';
const handyUrl = () => 'https://odinhennig-code.github.io/bastelraum/handy.html#k=' + pairKey();
async function sendToOdin(text, o) {
  o = o || {};
  try {
    const r = await fetch(NTFY + topicOdin(), { method: 'POST', body: text, headers: { Title: o.title || 'Nachricht von Mama', Priority: String(o.priority || 4), Tags: o.tags || 'speech_balloon' } });
    if (!r.ok) throw new Error(r.status);
    return true;
  } catch (e) { say('Nachricht konnte nicht gesendet werden – kein Internet?'); return false; }
}
let inbox = null;
/* Zwei Wege gleichzeitig: Live-Verbindung UND alle 8 s nachfragen.
   Manche Tablets halten die Live-Verbindung offen, liefern aber nichts aus. */
const seenMsg = new Set();
let lastMsgId = store.get('lastMsgId', null), lastHeard = 0;
function handleIncoming(m) {
  if (!m || m.event !== 'message' || !m.message || seenMsg.has(m.id)) return;
  seenMsg.add(m.id); lastMsgId = m.id; store.set('lastMsgId', m.id); lastHeard = Date.now();
  if (m.title === 'Test') { sendToOdin('Das Tablet hat deinen Test bekommen ✓', { title: 'Bastelraum', priority: 3, tags: 'white_check_mark' }); say('Test vom Handy angekommen ✓'); return; }
  receiveMessage(m.message);
}
function listenHandy() {
  try {
    if (inbox) inbox.close();
    inbox = new EventSource(NTFY + topicTablet() + '/sse');
    inbox.onmessage = (e) => { try { handleIncoming(JSON.parse(e.data)); } catch (x) {} };
    inbox.onerror = () => { if (inbox.readyState === 2) setTimeout(listenHandy, 5000); };
  } catch (e) {}
}
let polling = false, pollStart = Math.floor(Date.now() / 1000) - 30;
async function pollHandy() {
  if (polling) return; polling = true;
  try {
    const since = lastMsgId || pollStart;
    const r = await fetch(NTFY + topicTablet() + '/json?poll=1&since=' + since, { cache: 'no-store' });
    if (r.ok) { lastHeard = Date.now(); (await r.text()).split('\n').forEach((l) => { if (l.trim()) try { handleIncoming(JSON.parse(l)); } catch (x) {} }); }
  } catch (e) {}
  polling = false;
}

/* Flüssige, organische Bewegung: weiche Kurven durch die Wegpunkte, sanftes Anfahren und Abbremsen,
   Neigung in Laufrichtung und leichtes Quetschen je nach Tempo */
let rafTok = 0;
function cr(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => .5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}
function glide(pts, speed, opts) {
  opts = opts || {};
  const tok = ++rafTok;
  const P0 = [[B.x, B.y]].concat(pts), P = [P0[0]];
  for (let i = 1; i < P0.length; i++) {
    const a = P0[i - 1], b = P0[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.floor(d / 50);
    for (let k = 1; k < n; k++) P.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
    P.push(b);
  }
  const S = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    for (let t = 0; t < 1; t += 0.04) S.push(cr(p0, p1, p2, p3, t));
  }
  S.push(P[P.length - 1]);
  const Ls = [0];
  for (let i = 1; i < S.length; i++) Ls.push(Ls[i - 1] + Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]));
  const total = Ls[Ls.length - 1], dur = Math.max(200, total / speed * 1000);
  lbtn.style.transition = 'opacity .3s';
  return new Promise((res) => {
    const t0 = performance.now(); let px = B.x, j = 0, tilt = 0;
    function frame(now) {
      if (tok !== rafTok) { res(false); return; }
      const u = Math.min(1, (now - t0) / dur);
      const e = opts.linear ? u : (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const d = e * total;
      while (j < Ls.length - 2 && Ls[j + 1] < d) j++;
      const seg = Ls[j + 1] - Ls[j] || 1, k = Math.min(1, Math.max(0, (d - Ls[j]) / seg));
      const x = S[j][0] + (S[j + 1][0] - S[j][0]) * k, y = S[j][1] + (S[j + 1][1] - S[j][1]) * k;
      const vx = x - px; px = x;
      tilt += ((Math.max(-12, Math.min(12, vx * 2.2))) - tilt) * .15;

function ringParam(x, y) {                 // Punkt -> Position auf dem Rundweg (im Uhrzeigersinn ab oben links)
  const W = RING.x1 - RING.x0, H = RING.y1 - RING.y0;
  const dTop = Math.abs(y - RING.y0), dBot = Math.abs(y - RING.y1), dL = Math.abs(x - RING.x0), dR = Math.abs(x - RING.x1);
  const m = Math.min(dTop, dBot, dL, dR);
  const cx = Math.max(RING.x0, Math.min(RING.x1, x)), cy = Math.max(RING.y0, Math.min(RING.y1, y));
  if (m === dTop) return cx - RING.x0;
  if (m === dR) return W + (cy - RING.y0);
  if (m === dBot) return W + H + (RING.x1 - cx);
  return 2 * W + H + (RING.y1 - cy);
}
function ringPoint(t) {
  const W = RING.x1 - RING.x0, H = RING.y1 - RING.y0, P = 2 * (W + H);
  t = ((t % P) + P) % P;
  if (t <= W) return [RING.x0 + t, RING.y0];
  if (t <= W + H) return [RING.x1, RING.y0 + (t - W)];
  if (t <= 2 * W + H) return [RING.x1 - (t - W - H), RING.y1];
  return [RING.x0, RING.y1 - (t - 2 * W - H)];
}
function ringRoute(x0, y0, x1, y1) {       // Wegpunkte über den Rundweg, kürzere Richtung
  const W = RING.x1 - RING.x0, H = RING.y1 - RING.y0, P = 2 * (W + H);
  const a = ringParam(x0, y0), b = ringParam(x1, y1);
  let d = b - a; if (d > P / 2) d -= P; if (d < -P / 2) d += P;
  const corners = [0, W, W + H, 2 * W + H].map((c) => c);
  const pts = [ringPoint(a)];
  const step = d > 0 ? 1 : -1;
  const passed = [];
  for (const c of corners) for (const k of [-1, 0, 1]) {
    const cc = c + k * P;
    if ((step > 0 && cc > a && cc < a + d) || (step < 0 && cc < a && cc > a + d)) passed.push(cc);
  }
  passed.sort((p, q) => step * (p - q));
  passed.forEach((c) => pts.push(ringPoint(c)));
  pts.push(ringPoint(a + d));
  return pts;
}

/* --- Zahlen und Zeiten verstehen --- */
const NUMW = { ein: 1, eins: 1, eine: 1, einen: 1, einer: 1, zwei: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, zwölf: 12,
  dreizehn: 13, vierzehn: 14, fünfzehn: 15, sechzehn: 16, siebzehn: 17, achtzehn: 18, neunzehn: 19, zwanzig: 20, dreißig: 30, vierzig: 40, fünfzig: 50, sechzig: 60 };
function wordNum(w) {
  if (/^\d+([.,]\d+)?$/.test(w)) return parseFloat(w.replace(',', '.'));
  if (NUMW[w] != null) return NUMW[w];
  const m = w.match(/^(\w+?)und(zwanzig|dreißig|vierzig|fünfzig)$/);
  if (m && NUMW[m[1]] != null) return NUMW[m[1]] + NUMW[m[2]];
  return null;
}
function parseDuration(t) {
  let sec = 0;
  if (/halbe stunde/.test(t)) sec += 1800;
  if (/viertelstunde/.test(t)) sec += 900;
  if (/anderthalb stunden|eineinhalb stunden/.test(t)) sec += 5400;
  const re = /([\wäöüß.,]+)\s*(stunden?|std|minuten?|min|sekunden?|sek)\b/g; let m;
  while ((m = re.exec(t))) {
    const n = wordNum(m[1]); if (n == null) continue;
    sec += n * (m[2].startsWith('st') ? 3600 : m[2].startsWith('mi') ? 60 : 1);
  }
  return Math.round(sec);
}
function durText(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = [];
  if (h) p.push(h + (h === 1 ? ' Stunde' : ' Stunden'));
  if (m) p.push(m + (m === 1 ? ' Minute' : ' Minuten'));
  if (x) p.push(x + (x === 1 ? ' Sekunde' : ' Sekunden'));
  return p.join(' und ');
}

/* „dass das Essen fertig ist“ -> „Das Essen ist fertig“ */
function dassToMain(x) {
  const w = x.split(' '); if (w.length < 3) return x;
  const verb = w.pop();
  const art = /^(der|die|das|dein|deine|mein|meine|ein|eine|unser|unsere)$/i.test(w[0]);
  const pro = /^(du|er|sie|es|wir|ihr|ich|man)$/i.test(w[0]);
  const at = art ? 2 : pro ? 1 : 1;
  w.splice(at, 0, verb); return w.join(' ');
}

      weather = {
        temp: Math.round(d.current.temperature_2m), desc: WMO(d.current.weather_code),
        hourly: [0, 1, 2, 3].map((i) => ({ t: d.hourly.time[nowIdx + i].slice(11, 13) + ' Uhr', v: Math.round(d.hourly.temperature_2m[nowIdx + i]) + '°' }))
      };
      store.set('weatherPos', [lat, lon]); renderWeather();
    }).catch(() => {});
  const saved = store.get('weatherPos', null);
  if (saved) go(saved[0], saved[1]);
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition((p) => go(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3)), () => {}, { timeout: 15000 });
}
function renderWeather() {
  if (!weather) return;
  $('weatherPill').classList.remove('hidden');
  $('weatherTxt').textContent = weather.temp + '° ' + weather.desc.toLowerCase();
  $('n2Weather').classList.remove('hidden');
  $('n2Temp').textContent = weather.temp + '°'; $('n2Desc').textContent = weather.desc;
  $('n2Hourly').innerHTML = weather.hourly.map((h) => '<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font-size:13px;color:rgba(255,255,255,.55)">' + h.t + '</span><span class="num" style="font-size:20px;font-weight:500">' + h.v + '</span></div>').join('');
}
loadWeather(); setInterval(loadWeather, 20 * 60 * 1000);

/* =========================================================
   STERNE FÜR DEN NACHTMODUS
   ========================================================= */
(function () {
  let h = '';
  for (let i = 0; i < 40; i++) {
    const r = (n) => ((Math.sin(i * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1;
    h += '<span class="tw" style="position:absolute;left:' + (r(1) * 100).toFixed(1) + '%;top:' + (r(2) * 70).toFixed(1) + '%;width:' + (1 + r(3) * 2).toFixed(1) + 'px;height:' + (1 + r(3) * 2).toFixed(1) + 'px;border-radius:50%;background:#fff;opacity:.8;animation-delay:' + (-r(4) * 3).toFixed(2) + 's"></span>';
  }
  $('stars').innerHTML = h;
})();

/* =========================================================
   TAKT (jede halbe Sekunde)
   ========================================================= */
let beat = 0;
function tick() {
  const d = new Date();
  $('clkH').textContent = p2(d.getHours()); $('clkM').textContent = p2(d.getMinutes());
  $('date').textContent = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  if (view === 'night') $('n1Clock').textContent = hhmm(d);
  if (view === 'night2') {
    $('n2H').textContent = p2(d.getHours()); $('n2M').textContent = p2(d.getMinutes()); $('n2S').textContent = p2(d.getSeconds());
    $('n2Date').textContent = $('date').textContent; $('secBar').style.width = (d.getSeconds() / 59 * 100) + '%';
  }
  renderTimer(); renderSw();
}
setInterval(() => {
  tick();
  beat++;
  const anyDone = timers.some((t) => left(t) <= 0);
  reportAudio();
  if (anyDone && beat % 4 === 0) { sndAlarm(); if (view.startsWith('night')) show('home'); }
}, 500);

/* Start */
renderMsg(); renderRadio(); renderMats(); show('home');
</script>
